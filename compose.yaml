services:
  postgres:
    image: postgres:16
    container_name: futmarket-db
    restart: always
    environment:
      POSTGRES_DB: futmarket
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d futmarket"]
      interval: 5s
      timeout: 5s
      retries: 10

