spring.config.import=optional:file:./.env.properties
server.port=8080
spring.application.name=futmarket

# Configuracion de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/futmarket
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Valuation strategy configuration
futmarket.valuation.base-value=1.0
futmarket.valuation.scale-factor=10.0

# JWT configuration
futmarket.jwt.expiration=86400000

# WhoScored scraping
futmarket.whoscored.enabled=true
futmarket.whoscored.delay-millis=1500

# Cron para sincronizar jugadores: cada hora a las :00 minutos
# Formato: segundo minuto hora dia_mes mes dia_semana
# 0 0 * * * * = cada hora
# 0 0 0 * * * = diariamente a las 00:00
# 0 0 */6 * * * = cada 6 horas
futmarket.players.sync.cron=0 0 * * * *

# Cron para sincronizar stats: diariamente a las 02:00
futmarket.players.stats.sync.cron=0 0 2 * * *
