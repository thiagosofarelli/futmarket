spring.config.import=optional:file:./.env.properties
server.port=8080
spring.application.name=futmarket

# Configuracion de PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/futmarket
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=true

# Valuation strategy configuration
futmarket.valuation.base-value=1.0
futmarket.valuation.scale-factor=10.0

# JWT configuration
futmarket.jwt.expiration=86400000

# WhoScored scraping
futmarket.whoscored.enabled=true
futmarket.whoscored.delay-millis=1500