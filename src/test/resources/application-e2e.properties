spring.config.import=optional:file:./.env.properties
spring.datasource.url=jdbc:h2:mem:e2e-testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.cache.type=none

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

spring.docker.compose.enabled=false

futmarket.whoscored.enabled=false
futmarket.whoscored.delay-millis=0
futmarket.valuation.base-value=1.0
futmarket.valuation.scale-factor=10.0
futmarket.jwt.expiration=86400000
