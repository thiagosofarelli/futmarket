spring.config.import=optional:file:./.env.properties
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

spring.docker.compose.enabled=false

# Valuation strategy configuration
futmarket.valuation.base-value=1.0
futmarket.valuation.scale-factor=10.0

# JWT configuration
futmarket.jwt.expiration=86400000

# WhoScored scraping
futmarket.whoscored.enabled=true
futmarket.whoscored.delay-millis=1500

# Cron para sincronizar jugadores: cada hora a las :00 minutos
# Formato: segundo minuto hora dia_mes mes dia_semana
# 0 0 * * * * = cada hora
# 0 0 0 * * * = diariamente a las 00:00
# 0 0 */6 * * * = cada 6 horas
futmarket.players.sync.cron=0 0 * * * *

# Cron para sincronizar stats: diariamente a las 02:00
futmarket.players.stats.sync.cron=0 0 2 * * *
