name: Java CI with Maven

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ------------------------------------------------------------
  # JOB 1: COMPILACIÓN, TESTS Y COBERTURA (Build)
  # ------------------------------------------------------------
  build:
    name: Build & Test (JaCoCo)
    runs-on: ubuntu-latest

    env:
      JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 and Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Ejecuta compilación, tests unitarios y tests E2E
      - name: Compile, Test and Verify
        run: mvn -B clean verify

      # Sube los reportes de surefire por si falla algún test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      # Guarda la carpeta target para compartirla con el job de Sonar
      - name: Share target folder for Sonar
        uses: actions/upload-artifact@v4
        with:
          name: maven-target-artifacts
          path: target/
          retention-days: 1

  # ------------------------------------------------------------
  # JOB 2: ANÁLISIS DE SONARCLOUD
  # ------------------------------------------------------------
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: build # Espera a que el build termine con éxito

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Necesario para que SonarCloud calcule blame e historial

      - name: Set up JDK 17 and Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Descarga la carpeta target generada en el Job anterior
      - name: Download target artifacts
        uses: actions/download-artifact@v4
        with:
          name: maven-target-artifacts
          path: target/

      # Lanza Sonar apuntando a la ruta exacta del XML de cobertura
      - name: Analyze with SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mvn -B sonar:sonar \
            -Dsonar.organization=thiagosofarelli \
            -Dsonar.projectKey=thiagosofarelli_futmarket \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=${{ github.workspace }}/target/site/jacoco/jacoco.xml

  # ------------------------------------------------------------
  # JOB 3: ENVÍO DE DEPENDENCIAS A GITHUB (Dependency Graph)
  # ------------------------------------------------------------
  dependency-submission:
    name: Dependency Submission
    runs-on: ubuntu-latest

    permissions:
      contents: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 and Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Submit dependency graph to GitHub
        uses: advanced-security/maven-dependency-submission-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}