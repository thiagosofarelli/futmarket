name: Java CI with Maven

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-sonar:
    runs-on: ubuntu-latest

    env:
      JWT_TOKEN: ${{ secrets.JWT_TOKEN }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Clave para SonarCloud: necesita el historial completo para evaluar cambios

      - name: Set up JDK 17 and Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # 1. Corre tests unitarios, E2E y genera el reporte de JaCoCo
      - name: Run verification & generate coverage
        run: mvn -B clean verify

      # 2. Dispara el análisis de SonarCloud leyendo el reporte generado previamente
      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B sonar:sonar

      # Guardamos reportes como artefactos por si querés revisarlos manualmente
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload JaCoCo report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  dependency-submission:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 and Maven
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Submit dependency graph to GitHub
        uses: advanced-security/maven-dependency-submission-action@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}